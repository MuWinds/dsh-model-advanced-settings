# dsh bundle patch: inserts this plugin into a profile's layer stack.
# One row drives both halves: the host API (lib/index.js, injects webServer)
# and the browser UI (lib/client.js, discovered through the dsh.client
# declaration in package.json).
- insert:
    - id: model-advanced-settings
      name: '@muwinds/dsh-model-advanced-settings'
